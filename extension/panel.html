<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e1e;
            color: #cccccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .status-container {
            padding: 20px;
            border-radius: 8px;
            background: #2d2d2d;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 { font-size: 20px; color: #ffffff; margin-top: 0; }
        .indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .connected { background-color: #4CAF50; }
        .disconnected { background-color: #f44336; }
        .connecting { background-color: #ff9800; }
        a { color: #4fc3f7; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="status-container">
        <h1>AsyncLens Extension</h1>
        <p>
            <span id="status-indicator" class="indicator disconnected"></span>
            <span id="status-text">Disconnected</span>
        </p>
        <p>Dashboard: <a href="http://localhost:3000" target="_blank">http://localhost:3000</a></p>
        <p><small>Capturing network requests from inspected window...</small></p>
    </div>
    <script src="panel.js"></script>
</body>
</html>
