<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsyncLens | Network Topography</title>

    <!-- 3D Graph Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three-spritetext@1.8.2/dist/three-spritetext.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root {
            --bg-deep: #030305;
            --panel-glass: rgba(15, 15, 20, 0.7);
            --panel-glass-hover: rgba(25, 25, 35, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            --accent-primary: #8b5cf6;
            --accent-glow: 0 0 20px rgba(139, 92, 246, 0.4);
            --accent-cyan: #06b6d4;
            --accent-rose: #f43f5e;

            --status-good: #10b981;
            --status-warn: #f59e0b;
            --status-bad: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        header {
            height: 60px;
            background: var(--panel-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .brand {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(90deg, #fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--status-good);
            box-shadow: 0 0 12px var(--status-good);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .metrics-deck { display: flex; gap: 16px; }

        .metric-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .metric-val {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: var(--text-main);
            font-size: 13px;
        }

        .controls { display: flex; gap: 10px; }

        input, select, button {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus { border-color: var(--accent-primary); box-shadow: var(--accent-glow); }
        button { cursor: pointer; font-weight: 600; background: rgba(255,255,255,0.05); }
        button:hover { background: var(--accent-primary); border-color: var(--accent-primary); color: #fff; box-shadow: var(--accent-glow); }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }

        #graph-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at 50% 50%, #1a1a24 0%, #030305 100%);
            overflow: hidden;
        }

        .graph-controls {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 50;
            display: flex;
            gap: 8px;
            background: var(--panel-glass);
            padding: 6px;
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(10px);
        }
        .graph-controls button { padding: 6px 12px; }

        #sidebar {
            width: 420px;
            background: var(--panel-glass);
            backdrop-filter: blur(30px);
            border-left: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            z-index: 20;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        #stream-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stream-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .stream-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: transparent;
            transition: background 0.2s;
        }

        .stream-card:hover { background: var(--panel-glass-hover); border-color: var(--border-highlight); transform: translateY(-1px); }
        .stream-card.active { background: rgba(139, 92, 246, 0.08); border-color: rgba(139, 92, 246, 0.3); }
        .stream-card.active::before { background: var(--accent-primary); box-shadow: 0 0 10px var(--accent-primary); }

        .card-header { display: flex; justify-content: space-between; align-items: center; }

        .method-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
        }

        .badge-get { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-post { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); }
        .badge-other { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.2); }

        .status-badge { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--text-muted); }
        .status-badge.err { color: var(--status-bad); font-weight: 600; }

        .latency-text { font-size: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
        .lat-fast { color: var(--status-good); }
        .lat-med { color: var(--status-warn); }
        .lat-slow { color: var(--status-bad); }

        .url-text {
            color: #e2e8f0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        #inspector { height: 280px; background: #000; border-top: 1px solid var(--border-glass); display: flex; flex-direction: column; }
        .tabs { display: flex; border-bottom: 1px solid var(--border-glass); background: rgba(25, 25, 30, 0.5); }
        .tab { padding: 12px 24px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-muted); transition: 0.2s; position: relative; }
        .tab:hover { color: #fff; background: rgba(255,255,255,0.02); }
        .tab.active { color: var(--accent-primary); }
        .tab.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--accent-primary); box-shadow: 0 -2px 10px rgba(139, 92, 246, 0.5); }

        .tab-content { padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 11px; overflow-y: auto; flex: 1; }
        .kv-row { display: flex; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
        .kv-row:last-child { border-bottom: none; }
        .kv-key { width: 120px; color: var(--text-muted); flex-shrink: 0; }
        .kv-val { color: var(--text-main); word-break: break-all; }
        .empty-state { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 13px; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        #graph-legend {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 50;
            background: var(--panel-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            padding: 14px 18px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            pointer-events: none;
        }

        .legend-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 2px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 6px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-main);
        }

        .dot-icon {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        
        .line-icon {
            width: 16px;
            height: 2px;
            display: inline-block;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand"><span class="pulse-dot"></span> AsyncLens</div>
        <div class="metrics-deck">
            <div class="metric-pill">Requests: <span class="metric-val" id="m-count">0</span></div>
            <div class="metric-pill">Avg Latency: <span class="metric-val" id="m-latency">0ms</span></div>
            <div class="metric-pill">Domains: <span class="metric-val" id="m-domains">0</span></div>
        </div>
        <div class="controls">
            <input type="text" id="search-box" placeholder="Filter URL...">
            <select id="filter-type">
                <option value="All">All Resource Types</option>
                <option value="fetch">Fetch / XHR</option>
                <option value="image">Images</option>
                <option value="script">Scripts</option>
            </select>
            <button id="clear-btn">Purge Data</button>
        </div>
    </header>

    <main>
        <!-- Floating Legend overlay -->
        <div id="graph-legend">
            <div class="legend-title">Node Legend</div>
            <div class="legend-row">
                <span class="dot-icon" style="background: #ffffff; box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);"></span>
                <span>Page Origin (Root)</span>
            </div>
            <div class="legend-row">
                <span class="dot-icon" style="background: #8b5cf6; box-shadow: 0 0 8px rgba(139, 92, 246, 0.8);"></span>
                <span>Domain Hub</span>
            </div>
            <div class="legend-row">
                <span class="dot-icon" style="background: #06b6d4; box-shadow: 0 0 8px rgba(6, 182, 212, 0.8);"></span>
                <span>Resource / Script</span>
            </div>
            <div class="legend-row" style="margin-top: 4px;">
                <span class="dot-icon" style="background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);"></span>
                <span>Fast (&lt;150ms)</span>
            </div>
            <div class="legend-row">
                <span class="dot-icon" style="background: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.8);"></span>
                <span>Medium (150-400ms)</span>
            </div>
            <div class="legend-row">
                <span class="dot-icon" style="background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);"></span>
                <span>Slow (&gt;400ms)</span>
            </div>
            <div class="legend-title" style="margin-top: 6px;">Edge Legend</div>
            <div class="legend-row">
                <span class="line-icon" style="background: #06b6d4;"></span>
                <span>Initiated By</span>
            </div>
            <div class="legend-row">
                <span class="line-icon" style="background: #f43f5e;"></span>
                <span>Redirect</span>
            </div>
        </div>

        <div id="graph-container"></div>

        <div id="sidebar">
            <div id="stream-list"></div>
            <div id="inspector">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('general')">General</div>
                    <div class="tab" onclick="switchTab('headers')">Headers</div>
                </div>
                <div class="tab-content" id="tab-content">
                    <div class="empty-state">Select a node or request to inspect</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let requests = [];
        let relationships = [];
        let graphNodes = [{ id: "PAGE", label: "Origin", isRoot: true }];
        let graphLinks = [];
        let selectedId = null;
        let activeTab = 'general';

        function getDomain(url) {
            try { return new URL(url).hostname; }
            catch { return 'unknown-origin'; }
        }

        function getLatencyStatus(duration) {
            if (duration < 150) return 'fast';
            if (duration <= 400) return 'med';
            return 'slow';
        }

        function getLatencyColor(duration) {
            if (duration < 150) return '#10b981';
            if (duration <= 400) return '#f59e0b';
            return '#ef4444';
        }

        function getMethodBadge(method) {
            if (method === 'GET') return 'badge-get';
            if (method === 'POST') return 'badge-post';
            return 'badge-other';
        }

        // Helper to safely extract Node ID
        const getNodeId = (nodeRef) => typeof nodeRef === 'object' ? nodeRef.id : nodeRef;

        // TIMING NORMALIZATION HELPER
        function normalizeTimings(rawTimings) {
            const timings = rawTimings || {};
            
            // Helper to safely parse a phase value
            const getPhaseValue = (val) => {
                if (val === undefined || val === null || val === -1) return -1; // Unavailable
                const num = Number(val);
                if (isNaN(num) || num < 0) return -1; // Fallback for invalid non-numeric or negative
                return num; // Valid timing (including 0)
            };

            const normalized = {
                blocked: getPhaseValue(timings.blocked),
                dns: getPhaseValue(timings.dns),
                connect: getPhaseValue(timings.connect),
                ssl: getPhaseValue(timings.ssl),
                send: getPhaseValue(timings.send),
                wait: getPhaseValue(timings.wait),
                receive: getPhaseValue(timings.receive)
            };

            // Calculate sum of valid phases
            let validSum = 0;
            const phases = ['blocked', 'dns', 'connect', 'ssl', 'send', 'wait', 'receive'];
            phases.forEach(phase => {
                if (normalized[phase] !== -1) {
                    validSum += normalized[phase];
                }
            });
            
            normalized.availablePhaseTime = validSum;
            
            return normalized;
        }

        // TIMELINE MODEL BUILDER
        function buildTimelineModel(req) {
            const timestamp = req.timestamp || 0;
            const duration = Math.max(0, req.duration || 0);
            
            const model = {
                startTime: timestamp,
                endTime: timestamp + duration,
                measuredDuration: duration,
                phases: []
            };

            const timings = req.normalizedTimings || {};
            const phaseOrder = ['blocked', 'dns', 'connect', 'ssl', 'send', 'wait', 'receive'];
            
            let currentOffset = 0;

            phaseOrder.forEach(name => {
                const phaseDuration = timings[name];
                
                if (phaseDuration !== undefined && phaseDuration !== null && phaseDuration !== -1 && !isNaN(phaseDuration)) {
                    model.phases.push({
                        name: name,
                        startOffset: currentOffset,
                        duration: phaseDuration,
                        available: true
                    });
                    currentOffset += phaseDuration;
                } else {
                    model.phases.push({
                        name: name,
                        startOffset: null,
                        duration: -1,
                        available: false
                    });
                }
            });

            return model;
        }

        const container = document.getElementById('graph-container');
        const Graph = ForceGraph3D()(container)
            .backgroundColor('#00000000')
            .nodeRelSize(6)
            .nodeId('id')
            .nodeVal(d => d.isRoot ? 12 : (d.isDomain ? 8 : (d.isResource ? 5 : 3)))
            .nodeColor(d => {
                if (d.isRoot) return '#ffffff';
                if (d.isDomain) return '#8b5cf6';
                if (d.isResource) return '#06b6d4'; 
                return getLatencyColor(d.duration);
            })
            .nodeThreeObject(node => {
                if (node.isDomain && typeof SpriteText !== 'undefined') {
                    const group = new THREE.Group();

                    const geometry = new THREE.SphereGeometry(8);
                    const material = new THREE.MeshLambertMaterial({
                        color: 0x8b5cf6,
                        transparent: true,
                        opacity: 0.9
                    });
                    const sphere = new THREE.Mesh(geometry, material);
                    group.add(sphere);

                    const sprite = new SpriteText(node.label);
                    sprite.color = '#e2e8f0';
                    sprite.textHeight = 4.5;
                    sprite.backgroundColor = 'rgba(15, 15, 20, 0.8)';
                    sprite.padding = [4, 8];
                    sprite.borderRadius = 4;
                    sprite.borderColor = '#8b5cf6';
                    sprite.borderWidth = 0.5;
                    sprite.fontFace = 'JetBrains Mono, monospace';
                    sprite.position.set(0, 14, 0); 
                    group.add(sprite);

                    return group;
                }
                return false; 
            })
            .nodeLabel(d => d.isDomain ? '' : `<div style="background: rgba(15,15,20,0.9); padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); font-family: 'JetBrains Mono', monospace; font-size: 11px;">${d.label}</div>`)
            .linkOpacity(0.3)
            .linkColor(l => {
                if (l.type === 'initiator-resource') return '#06b6d4';
                if (l.type === 'redirect') return '#f43f5e';
                return '#475569';
            })
            .linkWidth(l => {
                if (l.type === 'initiator-resource') return 0.5;
                if (l.type === 'redirect') return 1.5;
                return l.source.id === 'PAGE' ? 2 : 1;
            })
            .linkDirectionalParticles(l => {
                if (l.type === 'initiator-resource') return 2;
                if (l.type === 'redirect') return 3;
                return 2;
            })
            .linkDirectionalParticleSpeed(0.006)
            .linkDirectionalParticleWidth(1.5)
            .linkDirectionalParticleColor(l => {
                if (l.type === 'initiator-resource') return '#a5f3fc';
                if (l.type === 'redirect') return '#fecdd3';
                return null;
            })
            .onNodeClick(node => {
                if (node.isRoot) return;

                if (node.isDomain) {
                    const searchBox = document.getElementById('search-box');
                    searchBox.value = node.label;
                    searchBox.dispatchEvent(new Event('input'));

                    const distance = 100;
                    const distRatio = 1 + distance / Math.hypot(node.x || 1, node.y || 1, node.z || 1);
                    Graph.cameraPosition(
                        { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                        { x: node.x, y: node.y, z: node.z },
                        1000
                    );
                } else if (node.isResource) {
                    const distance = 80;
                    const distRatio = 1 + distance / Math.hypot(node.x || 1, node.y || 1, node.z || 1);
                    Graph.cameraPosition(
                        { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                        { x: node.x, y: node.y, z: node.z },
                        1000
                    );
                } else {
                    selectRequest(node.id);
                }
            });

        Graph.d3Force('charge').strength(-180);
        Graph.d3Force('link').distance(40);

        function updateMetrics() {
            document.getElementById('m-count').innerText = requests.length;
            const totalDuration = requests.reduce((acc, curr) => acc + (curr.duration || 0), 0);
            const avg = requests.length ? Math.round(totalDuration / requests.length) : 0;
            document.getElementById('m-latency').innerText = `${avg}ms`;
            document.getElementById('m-domains').innerText = new Set(requests.map(r => getDomain(r.url))).size;
        }

        function refreshGraph() {
            Graph.graphData({ nodes: graphNodes, links: graphLinks });
        }

        function analyzeRelationships(req) {
            let initUrl = null;
            if (req.initiator) {
                if (req.initiator.url) {
                    initUrl = req.initiator.url;
                } else if (req.initiator.stack && req.initiator.stack.callFrames && req.initiator.stack.callFrames.length > 0) {
                    initUrl = req.initiator.stack.callFrames[0].url;
                }
            }

            if (initUrl) {
                const exists = relationships.some(r => r.source === initUrl && r.target === req.id && r.type === 'initiator-resource');
                if (!exists) {
                    relationships.push({
                        source: initUrl,
                        target: req.id,
                        sourceType: "resource",
                        type: "initiator-resource",
                        confidence: "observed"
                    });
                }
            }

            if (req.redirectURL) {
                const targetReq = requests.find(r => r.url === req.redirectURL);
                if (targetReq) {
                    const exists = relationships.some(r => r.source === req.id && r.target === targetReq.id && r.type === 'redirect');
                    if (!exists) {
                        relationships.push({
                            source: req.id,
                            target: targetReq.id,
                            sourceType: "request",
                            type: "redirect",
                            confidence: "confirmed"
                        });
                    }
                }
            }

            const sourceReq = requests.find(r => r.redirectURL === req.url);
            if (sourceReq) {
                const exists = relationships.some(r => r.source === sourceReq.id && r.target === req.id && r.type === 'redirect');
                if (!exists) {
                    relationships.push({
                        source: sourceReq.id,
                        target: req.id,
                        sourceType: "request",
                        type: "redirect",
                        confidence: "confirmed"
                    });
                }
            }
        }

        const ws = new WebSocket(`ws://${window.location.host}`);
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'network-request') {
                
                // Normalizing timing data and generating timeline data model
                data.normalizedTimings = normalizeTimings(data.timings);
                data.timeline = buildTimelineModel(data);
                
                requests.unshift(data);
                
                analyzeRelationships(data);

                const domain = getDomain(data.url);
                const domainNodeId = `DOMAIN_${domain}`;

                if (!graphNodes.some(n => n.id === domainNodeId)) {
                    graphNodes.push({ id: domainNodeId, label: domain, isDomain: true });
                    graphLinks.push({ source: "PAGE", target: domainNodeId });
                }

                const urlParts = data.url.split('?')[0].split('/');
                const label = urlParts[urlParts.length - 1] || domain;

                graphNodes.push({ id: data.id, label: label.substring(0, 20), duration: data.duration });
                graphLinks.push({ source: domainNodeId, target: data.id });

                relationships.forEach(rel => {
                    if (rel.type === 'initiator-resource') {
                        const resId = "RES_" + rel.source;
                        
                        if (!graphNodes.some(n => n.id === resId)) {
                            let filename = "resource";
                            try {
                                const urlObj = new URL(rel.source);
                                const pathParts = urlObj.pathname.split('/');
                                const lastPart = pathParts.pop();
                                filename = lastPart ? lastPart : urlObj.hostname;
                            } catch(e) { filename = rel.source.substring(0, 30); }
                            
                            graphNodes.push({
                                id: resId,
                                label: filename,
                                isResource: true,
                                resourceUrl: rel.source
                            });
                        }

                        const linkExists = graphLinks.some(l => 
                            getNodeId(l.source) === resId && 
                            getNodeId(l.target) === rel.target && 
                            l.type === 'initiator-resource'
                        );
                        if (!linkExists) {
                            graphLinks.push({
                                source: resId,
                                target: rel.target,
                                type: 'initiator-resource'
                            });
                        }
                    } 
                    else if (rel.type === 'redirect') {
                        const sourceExists = graphNodes.some(n => n.id === rel.source);
                        const targetExists = graphNodes.some(n => n.id === rel.target);
                        
                        if (sourceExists && targetExists) {
                            const linkExists = graphLinks.some(l => 
                                getNodeId(l.source) === rel.source && 
                                getNodeId(l.target) === rel.target && 
                                l.type === 'redirect'
                            );
                            if (!linkExists) {
                                graphLinks.push({
                                    source: rel.source,
                                    target: rel.target,
                                    type: 'redirect'
                                });
                            }
                        }
                    }
                });

                if (requests.length > 150) {
                    const evicted = requests.pop();
                    
                    relationships = relationships.filter(r => {
                        if (r.target === evicted.id) return false;
                        if (r.sourceType === 'request' && r.source === evicted.id) return false;
                        return true;
                    });
                    
                    graphNodes = graphNodes.filter(n => n.id !== evicted.id);
                    
                    graphLinks = graphLinks.filter(l => 
                        getNodeId(l.source) !== evicted.id && 
                        getNodeId(l.target) !== evicted.id
                    );
                    
                    graphNodes = graphNodes.filter(n => {
                        if (!n.isResource) return true;
                        return graphLinks.some(l => getNodeId(l.source) === n.id || getNodeId(l.target) === n.id);
                    });
                }

                renderStream();
                refreshGraph();
                updateMetrics();
            }
        };

        function renderStream() {
            const list = document.getElementById('stream-list');
            list.innerHTML = '';

            const filterType = document.getElementById('filter-type').value.toLowerCase();
            const searchQ = document.getElementById('search-box').value.toLowerCase();

            requests.filter(r => {
                const matchesSearch = r.url.toLowerCase().includes(searchQ) || getDomain(r.url).toLowerCase().includes(searchQ);
                const matchesType = filterType === 'all' || (r.resourceType && r.resourceType.toLowerCase().includes(filterType));
                return matchesSearch && matchesType;
            }).forEach(req => {
                const card = document.createElement('div');
                card.className = `stream-card ${req.id === selectedId ? 'active' : ''}`;
                card.onclick = () => selectRequest(req.id);

                const duration = Math.round(req.duration || 0);
                const latStatus = getLatencyStatus(duration);
                const isError = req.status >= 400;

                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <span class="method-badge ${getMethodBadge(req.method)}">${req.method}</span>
                            <span class="status-badge ${isError ? 'err' : ''}" style="margin-left: 6px;">${req.status || '???'}</span>
                        </div>
                        <span class="latency-text lat-${latStatus}">${duration}ms</span>
                    </div>
                    <div class="url-text" dir="ltr" title="${req.url}">${req.url}</div>
                `;
                list.appendChild(card);
            });
        }

        function selectRequest(id) {
            selectedId = id;
            renderStream();
            renderInspector();

            const node = graphNodes.find(n => n.id === id);
            if (node && node.x !== undefined) {
                const distance = 80;
                const distRatio = 1 + distance / Math.hypot(node.x || 1, node.y || 1, node.z || 1);
                Graph.cameraPosition(
                    { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                    { x: node.x, y: node.y, z: node.z },
                    1000
                );
            }
        }

        function renderInspector() {
            const content = document.getElementById('tab-content');
            const req = requests.find(r => r.id === selectedId);

            if (!req) {
                content.innerHTML = `<div class="empty-state">Select a node or request to inspect</div>`;
                return;
            }

            if (activeTab === 'general') {
                content.innerHTML = `
                    <div class="kv-row"><div class="kv-key">URL</div><div class="kv-val">${req.url}</div></div>
                    <div class="kv-row"><div class="kv-key">Method</div><div class="kv-val">${req.method}</div></div>
                    <div class="kv-row"><div class="kv-key">Status</div><div class="kv-val" style="color: ${req.status >= 400 ? '#ef4444' : '#10b981'}">${req.status || 'Unknown'}</div></div>
                    <div class="kv-row"><div class="kv-key">Type</div><div class="kv-val">${req.resourceType || 'fetch'}</div></div>
                    <div class="kv-row"><div class="kv-key">Duration</div><div class="kv-val">${Math.round(req.duration)}ms</div></div>
                    <div class="kv-row"><div class="kv-key">Size</div><div class="kv-val">${req.responseLength ? (req.responseLength / 1024).toFixed(2) + ' KB' : 'N/A'}</div></div>
                `;
            } else if (activeTab === 'headers') {
                let html = '<div style="color: var(--accent-primary); font-weight: 700; margin-bottom: 8px;">Request Headers</div>';
                if (req.requestHeaders && req.requestHeaders.length > 0) {
                    req.requestHeaders.forEach(h => {
                        html += `<div class="kv-row"><div class="kv-key">${h.name}</div><div class="kv-val">${h.value}</div></div>`;
                    });
                } else {
                    html += '<div class="kv-row" style="color: var(--text-muted)">No request headers recorded</div>';
                }

                html += '<br><div style="color: var(--accent-cyan); font-weight: 700; margin-bottom: 8px;">Response Headers</div>';
                if (req.responseHeaders && req.responseHeaders.length > 0) {
                    req.responseHeaders.forEach(h => {
                        html += `<div class="kv-row"><div class="kv-key">${h.name}</div><div class="kv-val">${h.value}</div></div>`;
                    });
                } else {
                    html += '<div class="kv-row" style="color: var(--text-muted)">No response headers recorded</div>';
                }
                content.innerHTML = html;
            }
        }

        window.switchTab = function(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderInspector();
        };

        document.getElementById('search-box').oninput = renderStream;
        document.getElementById('filter-type').onchange = renderStream;

        document.getElementById('clear-btn').onclick = () => {
            requests = [];
            relationships = [];
            graphNodes = [{ id: "PAGE", label: "Origin", isRoot: true }];
            graphLinks = [];
            selectedId = null;
            renderStream();
            refreshGraph();
            updateMetrics();
            renderInspector();
            Graph.cameraPosition({ x: 0, y: 0, z: 300 }, { x: 0, y: 0, z: 0 }, 1000);
        };

        window.addEventListener('resize', () => {
            Graph.width(container.clientWidth);
            Graph.height(container.clientHeight);
        });

        refreshGraph();
    </script>
</body>
</html>
